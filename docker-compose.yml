services:
  strapi:
    container_name: strapiv2
    build: .
    image: strapi:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: strapiDB
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PORT: ${DATABASE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      NODE_ENV: ${NODE_ENV}
    volumes:
      - ./config:/opt/app/config
      - ./src:/opt/app/src
      - ./package.json:/opt/package.json
      - ./package-lock.json:/opt/package-lock.json
      - ./public/uploads:/opt/app/public/uploads
    ports:
      - '1337:1337'
    networks:
      - strapi
    depends_on:
      - strapiDB

  strapiDB:
    container_name: strapiDBv2
    restart: unless-stopped
    env_file:
      - .env
    # POSTGRES_IMAGE permite fijar la versión de Postgres por entorno.
    # Producción usa 14.5 (los datos existentes son de PG14; subir de versión
    # requiere pg_dump/pg_upgrade — no cambiar sin migración).
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      # Continuidad de datos: si DATA está definida (Dokploy/producción) se
      # montan los datos existentes; si no, volumen con nombre (local).
      - ${DATA:-strapiDBData}:/var/lib/postgresql/data/
    ports:
      - '5432:5432'
    networks:
      - strapi

volumes:
  strapiDBData:

networks:
  strapi:
    name: Strapi
    driver: bridge
