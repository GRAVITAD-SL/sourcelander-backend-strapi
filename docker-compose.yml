services:
  strapi:
    container_name: strapiv2
    build: .
    image: strapi:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: strapiDB
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PORT: ${DATABASE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      NODE_ENV: ${NODE_ENV}
    volumes:
      - ./config:/opt/app/config
      - ./src:/opt/app/src
      - ./package.json:/opt/package.json
      - ./package-lock.json:/opt/package-lock.json
      - ./public/uploads:/opt/app/public/uploads
    ports:
      # Puerto del HOST configurable (el dominio de Dokploy enruta por Traefik
      # al puerto INTERNO 1337, no necesita esta publicación).
      # En Dokploy setear STRAPI_PUBLISH_PORT para evitar colisiones con
      # contenedores huérfanos; en local queda el 1337 por defecto.
      - '${STRAPI_PUBLISH_PORT:-1337}:1337'
    networks:
      - strapi
    depends_on:
      - strapiDB

  strapiDB:
    container_name: strapiDBv2
    restart: unless-stopped
    env_file:
      - .env
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      # Volumen con nombre (la DB de producción arranca fresca con PG17).
      - strapiDBData:/var/lib/postgresql/data/
    ports:
      - '${DB_PUBLISH_PORT:-5432}:5432'
    networks:
      - strapi

volumes:
  strapiDBData:

networks:
  strapi:
    name: Strapi
    driver: bridge
